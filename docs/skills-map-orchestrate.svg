<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-label="Пользователь даёт задачи orchestrate. Parent ведёт состояние в memo, подбирает модель child, при желании калибруя её через jev.py, и пишет пользователю в стиле i-have-adhd. Child-агенты на session-worker: scout собирает факты для planner, dev-lead в своём worktree ведёт цикл dev, integrator сливает ветки, verifier проверяет итог и отдаёт receipt parent.">
<style>
svg { --bg: #fbfaf7;
    --fg: #1d1f23;
    --muted: #6b6f76;
    --surface: #ffffff;
    --line: #d9d6cf;
    --accent: #b4561d;
    --accent-soft: #fbeee5; color: var(--fg); }
@media (prefers-color-scheme: dark) { svg { --bg: #17181b;
    --fg: #e8e6e1;
    --muted: #9a9ea6;
    --surface: #202226;
    --line: #3a3d43;
    --accent: #f0955a;
    --accent-soft: #3a2a20; } }
text { fill: currentColor; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.t { font-size: 13px; font-weight: 600; }
.s { font-size: 11.5px; }
.m { font-size: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.mu { fill: var(--muted); }
.node { fill: var(--surface); stroke: currentColor; stroke-width: 1.2; }
.opt { stroke-dasharray: 5 4; }
.key { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.8; }
.zone { fill: none; stroke: var(--line); stroke-width: 1.4; stroke-dasharray: 6 5; }
.edge { fill: none; stroke: currentColor; stroke-width: 1.3; }
.lane { fill: none; stroke: currentColor; stroke-width: 2; }
.lane-mu { fill: none; stroke: var(--muted); stroke-width: 2; }
.dot { fill: currentColor; }
.dot-key { fill: var(--accent); }
.div { stroke: var(--line); stroke-width: 1; }
</style>
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <rect class="node" x="20" y="30" width="150" height="62" rx="8"/>
  <text class="t" x="95" y="66" text-anchor="middle">Пользователь</text>

  <line class="edge" x1="170" y1="48" x2="328" y2="48" marker-end="url(#a2)"/>
  <text class="s" x="249" y="40" text-anchor="middle">задачи, ID из memo</text>
  <line class="edge" x1="330" y1="76" x2="172" y2="76" marker-end="url(#a2)"/>
  <text class="s" x="251" y="93" text-anchor="middle">итог, вопрос о ветке</text>

  <rect class="key" x="330" y="20" width="280" height="95" rx="10"/>
  <text class="t" x="470" y="48" text-anchor="middle">orchestrate · parent</text>
  <text class="s" x="470" y="70" text-anchor="middle">карта зависимостей, назначения</text>
  <text class="s" x="470" y="90" text-anchor="middle">модель child, приёмка</text>

  <line class="edge" x1="610" y1="33" x2="698" y2="33" marker-end="url(#a2)"/>
  <line class="edge" x1="610" y1="71" x2="698" y2="71" marker-end="url(#a2)"/>
  <line class="edge" x1="610" y1="105" x2="698" y2="105" marker-end="url(#a2)"/>
  <rect class="node opt" x="700" y="18" width="280" height="30" rx="6"/>
  <text class="s" x="714" y="38">i-have-adhd — стиль сообщений</text>
  <rect class="node opt" x="700" y="56" width="280" height="30" rx="6"/>
  <text class="s" x="714" y="76">jev.py — калибровка модели (Jev/Kev)</text>
  <rect class="node" x="700" y="90" width="280" height="30" rx="6"/>
  <text class="s" x="714" y="110">memo — root, control, details</text>

  <line class="edge" x1="440" y1="115" x2="440" y2="168" marker-end="url(#a2)"/>
  <text class="s" x="432" y="148" text-anchor="end">brief v3, grant</text>
  <line class="edge" x1="500" y1="168" x2="500" y2="117" marker-end="url(#a2)"/>
  <text class="s" x="508" y="148">ready, отчёты, receipts</text>

  <rect class="zone" x="20" y="170" width="960" height="250" rx="10"/>
  <text class="s mu" x="36" y="194">child-агенты (session-worker или bootstrap): brief v3 → ready → grant → отчёт до 2000 символов; полные данные — в memo details</text>

  <!-- роли child -->
  <rect class="node" x="40" y="215" width="130" height="70" rx="8"/>
  <text class="t" x="105" y="238" text-anchor="middle">scout</text>
  <text class="s mu" x="105" y="256" text-anchor="middle">модель light</text>
  <text class="s mu" x="105" y="273" text-anchor="middle">только факты</text>

  <line class="edge" x1="170" y1="250" x2="213" y2="250" marker-end="url(#a2)"/>
  <text class="s" x="192" y="242" text-anchor="middle">факты</text>

  <rect class="node" x="215" y="215" width="140" height="70" rx="8"/>
  <text class="t" x="285" y="238" text-anchor="middle">planner</text>
  <text class="s mu" x="285" y="256" text-anchor="middle">декомпозиция</text>
  <text class="s mu" x="285" y="273" text-anchor="middle">карта зависимостей</text>

  <rect class="node" x="408" y="207" width="200" height="70" rx="8"/>
  <rect class="node" x="404" y="211" width="200" height="70" rx="8"/>
  <rect class="node" x="400" y="215" width="200" height="70" rx="8"/>
  <text class="t" x="500" y="238" text-anchor="middle">dev-lead × N</text>
  <text class="s mu" x="500" y="256" text-anchor="middle">свой worktree и ветка</text>
  <text class="m mu" x="500" y="273" text-anchor="middle">orch/&lt;run&gt;/&lt;task&gt;</text>

  <line class="edge" x1="608" y1="250" x2="643" y2="250" marker-end="url(#a2)"/>
  <text class="s" x="626" y="242" text-anchor="middle">ветки</text>

  <rect class="node" x="645" y="215" width="170" height="70" rx="8"/>
  <text class="t" x="730" y="238" text-anchor="middle">integrator</text>
  <text class="s mu" x="730" y="256" text-anchor="middle">merge в порядке карты</text>
  <text class="m mu" x="730" y="273" text-anchor="middle">orch/&lt;run&gt;/integration</text>

  <line class="edge" x1="815" y1="250" x2="858" y2="250" marker-end="url(#a2)"/>
  <text class="s" x="837" y="242" text-anchor="middle">tip</text>

  <rect class="key" x="860" y="215" width="110" height="70" rx="8"/>
  <text class="t" x="915" y="238" text-anchor="middle">verifier</text>
  <text class="s mu" x="915" y="256" text-anchor="middle">не автор</text>
  <text class="m mu" x="915" y="273" text-anchor="middle">final_git</text>

  <!-- цикл dev внутри dev-lead -->
  <line class="edge" x1="500" y1="285" x2="500" y2="328" marker-end="url(#a2)"/>
  <text class="s" x="508" y="311">ведёт цикл</text>

  <rect class="node" x="410" y="330" width="180" height="56" rx="8"/>
  <text class="t" x="500" y="353" text-anchor="middle">dev · T0–T3</text>
  <text class="s mu" x="500" y="373" text-anchor="middle">тесты → проверка → ревью</text>

  <line class="edge" x1="410" y1="358" x2="385" y2="358"/>
  <line class="edge" x1="385" y1="332" x2="385" y2="384"/>
  <line class="edge" x1="385" y1="332" x2="357" y2="332" marker-end="url(#a2)"/>
  <line class="edge" x1="385" y1="384" x2="357" y2="384" marker-end="url(#a2)"/>
  <rect class="node" x="40" y="315" width="315" height="34" rx="6"/>
  <text class="s" x="54" y="336">роли dev — запускает как субагентов</text>
  <rect class="node" x="40" y="367" width="315" height="34" rx="6"/>
  <text class="s" x="54" y="388">скилы дисциплины — читает по фазам</text>

  <line class="edge" x1="648" y1="358" x2="592" y2="358" marker-end="url(#a2)"/>
  <text class="s" x="620" y="350" text-anchor="middle">риск</text>
  <rect class="node" x="650" y="340" width="300" height="36" rx="6"/>
  <text class="s" x="664" y="362">REVIEW.md, AGENTS.md — риск и правила</text>
</svg>
