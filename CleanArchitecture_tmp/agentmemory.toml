# Конфиг AgentMemory для проекта Чистая архитектура (DESIGN.md §13).
#
# Агентское приложение поднимает MCP-сервер memo из сгенерированного
# рядом MCP-конфига и передаёт ему этот файл флагом -config.

[store]
# Общий файл БД на все проекты (DESIGN.md §2.1: один файл, изоляция через scope).
# Каталог создаётся автоматически при первом старте (store.Open).
path = "~/.agentmemory/memory.db"

[embedder]
# Локальный ollama (dim определяется автоматически пробным эмбеддингом).
# Если ollama недоступен — memo стартует, recall падает на чистый FTS5 (§15).
provider = "ollama"
base_url = "http://localhost:11434"
model    = "bge-m3:latest"

[reasoner]
# DeepSeek chat: ключ берётся из env DEEPSEEK_API_KEY. Если в shell-env его нет,
# memo сам подхватывает его из .env рядом с этим конфигом при старте (см.
# loadDotEnv в main.go) — .env раскладывается этим же "memo init". Пустой
# ключ — деградация до noop (§15): recall без суммаризации, консолидация
# недоступна, но память работает.
provider = "deepseek"
model    = "deepseek-v4-pro"

[recall]
default_token_budget = 800
weights = { relevance = 1.0, importance = 0.5, recency = 0.4, access = 0.2 }

[maint]
decay_interval    = "24h"
consolidate_after = "168h"                 # неделя episodic → semantic

[scope]
# Домашнее пространство project:Чистая архитектура, поверх него в recall всегда добавляется
# общий слой user:*. memory_save без явного scope пишет в project:Чистая архитектура;
# общие привычки — явно scope="user:*".
project = "Чистая архитектура"
shared  = ["user:*"]
