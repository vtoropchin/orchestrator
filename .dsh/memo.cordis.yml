# Проектный patch-оверлей DeepSeek Harness (Cordis) — MCP-сервер memo
# для проекта Skills. Сгенерирован `memo init`; пути абсолютные, потому что dsh
# запускает MCP-процесс с рабочим каталогом процесса харнесса.
#
# Подключение: разово — `dsh web --patch <этот файл>`, постоянно — блок
# ниже целиком, вместе со строками-маркерами, в patch-слой профиля
# ($DSH_HOME/cordis.patch.yml или $DSH_HOME/profiles/<профиль>/cordis.patch.yml);
# повторный memo init обновит вставленный блок сам.
# >>> memo /Users/vladimir/Programming/Skills
# сгенерировано memo init — правки внутри блока перезапишет следующий прогон
- insert:
    - id: memo
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: memo
        transport: stdio
        command: '/Users/vladimir/.local/bin/memo'
        args:
          - '-config'
          - '/Users/vladimir/Programming/Skills'
        env:
          DEEPSEEK_API_KEY: !!js process.env.DEEPSEEK_API_KEY ?? ''
    - id: memo-hooks
      name: '@deepseek-ai/dsh-hooks-claude-code'
      config:
        configPath: '/Users/vladimir/Programming/Skills/.dsh/memo-hooks.json'
# <<< memo /Users/vladimir/Programming/Skills
